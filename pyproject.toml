[build-system]
requires = ["hatchling>=1.18", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "obs-karaage"
dynamic = ["version"]
description = "Extracts attributable statements from English news articles and rephrases them, with a reference to their source passage"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "DTU RSO Observatory" }]
# Bounds allow the tested major versions; uv.lock pins the exact versions of a release.
dependencies = [
    "benepar==0.2.0",
    "en-core-web-md @ https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.8.0/en_core_web_md-3.8.0-py3-none-any.whl",
    "openai>=3,<4",
    "pydantic>=2,<3",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6,<7",
    "spacy>=3.8,<3.9",
    "tqdm>=4,<5",
    "transformers>=5,<6",
]

[project.scripts]
karaage = "karaage.cli:main"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/karaage/_version.py"

# hatch_build.py: writes src/karaage/_build_info.py with the git commit.
[tool.hatch.build.hooks.custom]

[tool.hatch.metadata]
# Needed for the spaCy model, which is not on PyPI.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/karaage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# torch_struct (used by benepar) warns about a deprecated torch API on every parse.
filterwarnings = ["ignore:.*does not define `arg_constraints`:UserWarning"]

[tool.uv]
# Rebuild the installed package, and so its version and commit, when the git commit or tags change.
cache-keys = [{ file = "pyproject.toml" }, { file = "hatch_build.py" }, { git = { commit = true, tags = true } }]

[tool.uv.sources]
# The snapshot validator is private, and installed from a clone next to this repo (docs/design-1.1.0.md, section 9).
obs-corpus-snapshot = { path = "../obs-corpus-snapshot" }

[dependency-groups]
dev = [
    "jsonschema>=4.23",
    "pytest>=9.2.0",
]
# Not installed by default: uv run --group snapshot pytest
snapshot = [
    "obs-corpus-snapshot",
]
